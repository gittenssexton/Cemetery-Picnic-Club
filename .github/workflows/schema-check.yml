name: Pine Grove database checks
on:
  push:
    paths:
      - "db/**"
      - "tests/**"
      - "architecture/**"
      - "scripts/validate_domains.py"
      - "docs/DOMAIN_ARCHITECTURE.md"
      - ".github/workflows/schema-check.yml"
  pull_request:
    paths:
      - "db/**"
      - "tests/**"
      - ".github/workflows/schema-check.yml"
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install contract validator
        run: python3 -m pip install 'jsonschema>=4.18,<5'
      - name: Run SQLite migration and seed tests
        run: |
          python3 scripts/validate_domains.py
          python3 -m unittest discover -s tests -v

      - name: Verify camera JPEG GPS export without changing original bytes
        run: node tests/test_camera_exif.mjs
