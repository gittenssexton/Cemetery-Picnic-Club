name: Pine Grove database checks
on:
  push:
    paths:
      - "db/**"
      - "tests/**"
      - "web/camera/**"
      - ".github/workflows/schema-check.yml"
  pull_request:
    paths:
      - "db/**"
      - "tests/**"
      - "web/camera/**"
      - ".github/workflows/schema-check.yml"
      - ".github/requirements-geology-test.txt"
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python geospatial testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-geology-test.txt
      - name: Install geology test dependencies
        run: python -m pip install -r .github/requirements-geology-test.txt
      - name: Run SQLite migration and seed tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node for camera export tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test camera public export privacy
        run: node tests/test_camera_export_privacy.js
      - name: Test camera ZIP writer and redaction
        run: node tests/test_camera_export_archive.js
      - name: Test camera GPS contract
        run: node tests/test_camera_gps_contract.js
      - name: Test cemetery resolver
        run: node tests/test_cemetery_gps_resolver.js
      - name: Test cemetery hierarchy
        run: node tests/test_cemetery_relations.js
      - name: Test geology-to-private camera capture contract
        run: node tests/test_camera_geology_integration.js
      - name: Test guided photo sequence
        run: node tests/test_guided_capture.js
      - name: Test live on-device analysis
        run: node tests/test_camera_live_analysis.js
      - name: Test pixel contour shapes and tracking
        run: node tests/test_camera_pixel_contours.js
